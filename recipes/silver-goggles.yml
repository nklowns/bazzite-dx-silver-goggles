---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  # ==========================================
  # LAYER 1: KERNEL TUNING
  # ==========================================
  - type: kargs
    kargs:
      - vconsole.keymap=br
      - kvm.nested=1

  # ==========================================
  # LAYER 2: SYSTEM TOOLS & VIRTUALIZATION
  # ==========================================
  - type: rpm-ostree
    install:
      - smbios-utils-python # Dell SMBIOS/BIOS management utilities

  # ==========================================
  # LAYER 3: HARDWARE (DELL G15 / AWCC)
  # ==========================================
  - type: rpm-ostree
    install:
      - awcc-dev.rpm

  - type: systemd
    system:
      enabled:
        - awccd.service
      masked:
        - thermald.service

  # ==========================================
  # LAYER 4: CUSTOMIZATIONS (Scripts & Configs)
  # ==========================================
  - type: justfiles
    include:
      - 66-silver-goggles.just
