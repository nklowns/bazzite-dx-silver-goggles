---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  # ==========================================
  # LAYER 1: KERNEL TUNING
  # ==========================================
  - type: kargs
    kargs:
      - vconsole.keymap=br
      - kvm.nested=1
      # High-performance Virtualization & KVMFR
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0
      - kvmfr.static_size_mb=128
      # IOMMU & VFIO for GPU Passthrough
      - intel_iommu=on
      - iommu=pt
      # F44 regression: install-nvidia script that copied modeset.conf to /usr/lib/modprobe.d/
      # was removed; initramfs loads nvidia_drm without modeset=1 → HDMI dead, 60fps cap
      - nvidia-drm.modeset=1

  # ==========================================
  # LAYER 2: SYSTEM TOOLS & VIRTUALIZATION
  # ==========================================
  - type: rpm-ostree
    install:
      - smbios-utils-python # Dell SMBIOS/BIOS management utilities
      - policycoreutils # Required for managing SELinux policies
      - looking-glass-client # High-performance Looking Glass client for KVMFR

  # ==========================================
  # LAYER 3: HARDWARE (DELL G15 / AWCC)
  # ==========================================
  - type: rpm-ostree
    install:
      - awcc-dev.rpm

  - type: systemd
    system:
      enabled:
        - awccd.service
      masked:
        - thermald.service

  # ==========================================
  # LAYER 4: CUSTOMIZATIONS (Scripts & Configs)
  # ==========================================
  - type: justfiles
    include:
      - 66-silver-goggles.just
