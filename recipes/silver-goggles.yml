---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  # ==========================================
  # LAYER 1: KERNEL TUNING
  # ==========================================
  - type: kargs
    kargs:
      - vconsole.keymap=br
      - kvm_intel.nested=1
      # High-performance Virtualization & KVMFR
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0
      # kvmfr.static_size_mb is NOT baked; kvmfr is opt-in via ujust setup-virtualization kvmfr-on
      # IOMMU & VFIO for GPU Passthrough
      - intel_iommu=on
      - iommu=pt
      # F44 regression: install-nvidia script that copied modeset.conf to /usr/lib/modprobe.d/
      # was removed; initramfs loads nvidia_drm without modeset=1 → HDMI dead, 60fps cap
      - nvidia-drm.modeset=1

  # ==========================================
  # LAYER 2: SYSTEM TOOLS & VIRTUALIZATION
  # ==========================================
  - type: rpm-ostree
    install:
      - smbios-utils-python # Dell SMBIOS/BIOS management utilities
      - policycoreutils # Required for managing SELinux policies
      - looking-glass-client # High-performance Looking Glass client for KVMFR

  # ==========================================
  # LAYER 3: HARDWARE (DELL G15 / AWCC)
  # ==========================================
  - type: rpm-ostree
    install:
      - awcc-dev.rpm

  - type: systemd
    system:
      enabled:
        - awccd.service
        # Regenerates /etc/cdi/nvidia.yaml from the live system, without which GPU
        # containers die on a stale spec:
        #     $ podman run --rm --device nvidia.com/gpu=all alpine ls /dev
        #     Error: crun: cannot stat `/run/nvidia-persistenced/socket`
        #
        # REDUNDANT ON PAPER, KEPT ON PURPOSE — and the first version of this comment got
        # the reason wrong, so here is what was actually measured. The bazzite-nvidia base
        # already enables this unit: both deployments on disk carry the symlink under
        # usr/etc/systemd/system/multi-user.target.wants/, including the one from before
        # this line existed. It was nevertheless `disabled` on the running host and the
        # spec had not been regenerated since 2026-04-24.
        #
        # The cause is not a missing enable, it is an ostree /etc merge that preserves a
        # local deletion forever: `ostree admin config-diff` reported it as `D`, and every
        # subsequent deployment inherits that, no matter how many times the image enables
        # it. Declaring it here therefore does NOT fix an upgraded host — only
        # `systemctl enable` on the host does, or a fresh install. It is kept because this
        # layer genuinely depends on the unit and that dependency should be legible, not
        # because it repairs anything. `ujust boot-audit` is what surfaces the divergence.
        #
        # Ordering after nvidia-persistenced is handled by a drop-in — see
        # files/system/usr/lib/systemd/system/ublue-nvctk-cdi.service.d/. Generating in the
        # degraded window silently omits the socket mount instead of failing, which is how
        # a spec ends up wrong rather than absent.
        - ublue-nvctk-cdi.service
      masked:
        - thermald.service

  # ==========================================
  # LAYER 4: CUSTOMIZATIONS (Scripts & Configs)
  # ==========================================
  - type: justfiles
    include:
      - 66-silver-goggles.just
      # Read-only audits. They exist because the Boot Impact Policy and the reserved port
      # range in AGENTS.md were both being contradicted by the running host without anything
      # noticing — a policy is only as real as the thing that checks it.
      - 69-audit.just
      - 70-ai-studio.just
