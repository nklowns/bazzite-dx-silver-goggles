---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  # ==========================================
  # LAYER 1: KERNEL TUNING
  # ==========================================
  - type: kargs
    kargs:
      - vconsole.keymap=br
      - kvm_intel.nested=1
      # High-performance Virtualization & KVMFR
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0
      # kvmfr.static_size_mb is NOT baked; kvmfr is opt-in via ujust setup-virtualization kvmfr-on
      # IOMMU & VFIO for GPU Passthrough
      - intel_iommu=on
      - iommu=pt
      # F44 regression: install-nvidia script that copied modeset.conf to /usr/lib/modprobe.d/
      # was removed; initramfs loads nvidia_drm without modeset=1 → HDMI dead, 60fps cap
      - nvidia-drm.modeset=1

  # ==========================================
  # LAYER 2: SYSTEM TOOLS & VIRTUALIZATION
  # ==========================================
  - type: rpm-ostree
    install:
      - smbios-utils-python # Dell SMBIOS/BIOS management utilities
      - policycoreutils # Required for managing SELinux policies
      - looking-glass-client # High-performance Looking Glass client for KVMFR

  # ==========================================
  # LAYER 3: HARDWARE (DELL G15 / AWCC)
  # ==========================================
  - type: rpm-ostree
    install:
      - awcc-dev.rpm

  - type: systemd
    system:
      enabled:
        - awccd.service
        # Regenerates /etc/cdi/nvidia.yaml from the live system. The unit ships in the
        # bazzite-nvidia base with `preset: enabled`, but the preset never took on this
        # deployment — no symlink in multi-user.target.wants, `is-enabled` reports
        # disabled. Consequence measured: the spec on disk was generated 2026-04-24 and
        # had not moved since, so it froze a hostPath to /run/nvidia-persistenced/socket
        # and would keep pointing at stale driver libs across NVIDIA bumps. Every CDI
        # GPU injection died on it:
        #     $ podman run --rm --device nvidia.com/gpu=all alpine ls /dev
        #     Error: crun: cannot stat `/run/nvidia-persistenced/socket`
        # Enabling it explicitly is the fix; it is a Type=oneshot that runs and exits, so
        # it costs no resident memory and does not contradict the Boot Impact Policy.
        # Ordering after nvidia-persistenced is handled by a drop-in — see
        # files/system/usr/lib/systemd/system/ublue-nvctk-cdi.service.d/, and note that
        # generating in the degraded window silently omits the socket mount instead of
        # failing, which is how a spec ends up wrong rather than absent.
        - ublue-nvctk-cdi.service
      masked:
        - thermald.service

  # ==========================================
  # LAYER 4: CUSTOMIZATIONS (Scripts & Configs)
  # ==========================================
  - type: justfiles
    include:
      - 66-silver-goggles.just
