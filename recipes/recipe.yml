---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-dx-silver-goggles
description: "Personal DX layer for Dell G15 5520 (i7-12700H / RTX 3060). KDE/NVIDIA — Slim Edition. Powered by BlueBuild."

# Slim Edition Policy: only KDE/NVIDIA variant
base-image: ghcr.io/ublue-os/bazzite-nvidia
# Digest pinned by Renovate — see .github/renovate.json5
image-version: latest # digest managed via image-versions.yaml (updated by Renovate)

alt-tags:
  - stable
  - "44"

labels:
  org.opencontainers.image.version: "44"

modules:
  - type: files
    files:
      - source: system
        destination: /

  - from-file: dx.yml
  - from-file: silver-goggles.yml

  - type: initramfs

  - type: dx-hardening
    source: local

  - type: dx-verify
    source: local

  - type: os-release
    properties:
      NAME: "Bazzite DX"
      PRETTY_NAME: "Bazzite Developer Experience"
      DEFAULT_HOSTNAME: bazzite-dx
      VARIANT_ID: silver-goggles
      VARIANT: "Silver Goggles (Dell G15 5520)"
      HOME_URL: "https://bazzite.gg"
      DOCUMENTATION_URL: "https://dev.bazzite.gg"
      SUPPORT_URL: "https://github.com/ublue-os/bazzite/issues"
      BUG_REPORT_URL: "https://github.com/ublue-os/bazzite/issues"
      CPE_NAME: "cpe:/o:universal-blue:bazzite-dx"

  - type: signing
