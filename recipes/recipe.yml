---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-dx-silver-goggles
description: "Personal DX layer for Dell G15 5520 (i7-12700H / RTX 3060). KDE/NVIDIA — Slim Edition. Powered by BlueBuild."

# Slim Edition Policy: only KDE/NVIDIA variant
base-image: ghcr.io/nklowns/bazzite-dx-nvidia
# Digest pinned by Renovate — see .github/renovate.json5
image-version: e021c3c-latest-43 # renovate: datasource=docker depName=ghcr.io/nklowns/bazzite-dx-nvidia

modules:
  # ── LAYER 1: CORE ENGINE ──────────────────────────────────────────────────
  # Injects all files from files/system/* into the image root and modular
  # ujust recipes for internal workspace management.
  - type: files
    files:
      - source: system
        destination: /

  - type: justfiles
    include:
      - 60-custom.just

  # ── LAYER 2: EXTENSIONS ───────────────────────────────────────────────────
  # Extra RPMs not present in bazzite-dx upstream.
  - type: rpm-ostree
    install:
      - smbios-utils-python # Dell SMBIOS/BIOS management utilities
      - tmux # Terminal multiplexer

  # ── LAYER 3: KERNEL TUNING ────────────────────────────────────────────────
  # Declarative boot-time arguments via native bootc-toml module.
  # Handles VFIO GPU passthrough, bluetooth fixes and Brazilian keyboard layout.
  - type: kargs
    kargs:
      - vconsole.keymap=br
      - bluetooth.disable_ertm=1
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0
      - intel_iommu=on
      - iommu=pt
      - rd.driver.pre=vfio-pci
      - vfio_pci.disable_vga=1

  # ── LAYER 4: HARDWARE (DELL G15 / AWCC) ───────────────────────────────────
  # Specialized Alienware Command Center orchestration.
  # Installs the local canonical RPM declared in files/rpm-ostree/.
  - type: rpm-ostree
    install:
      - awcc-dev.rpm

  - type: systemd
    system:
      enabled:
        - awccd.service
      masked:
        - thermald.service

  # ── LAYER 5: IDENTITY & SECURITY ──────────────────────────────────────────
  - type: os-release
    properties:
      VARIANT_ID: silver-goggles
      VARIANT: "Silver Goggles (Dell G15 5520)"

  - type: signing
