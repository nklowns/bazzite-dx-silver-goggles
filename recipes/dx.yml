---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  # ==========================================
  # LAYER 1: SYSTEM INFRASTRUCTURE (CORE)
  # ==========================================
  - type: dnf
    repos:
      cleanup: true
      copr:
        - karmab/kcli
        - gmaglione/podman-bootc
        - ublue-os/packages
    install:
      packages:
        - kcli
        - podman-bootc
        - ublue-setup-services
        - ublue-os-libvirt-workarounds

  - type: rpm-ostree
    repos:
      - https://download.docker.com/linux/fedora/docker-ce.repo
      - https://download.opensuse.org/repositories/home:/cloud-hypervisor/Fedora_43/home:cloud-hypervisor.repo
    install:
      # --- Cockpit Plugins (Bazzite pre-installed) ---
      - cockpit-bridge # Cockpit: Node monitoring bridge
      - cockpit-machines # Cockpit: VM management
      - cockpit-ostree # Cockpit: rpm-ostree management
      - cockpit-ws # Cockpit: Web service
      # - cockpit-packagekit # Cockpit: Package management
      # - cockpit-networkmanager # Cockpit: Network management
      # - cockpit-podman # Cockpit: Container management
      # - cockpit-selinux # Cockpit: SELinux management
      # - cockpit-system # Cockpit: System dashboard
      # - cockpit-files # Cockpit: File management
      # - cockpit-storaged # Cockpit: Storage management
      # --- Container & Virtualization Engines ---
      - containerd.io # Container: Runtime
      - docker-ce # Container: Community Edition
      - docker-ce-cli # Container: CLI tools
      - docker-buildx-plugin # Container: Buildx plugin
      - docker-compose-plugin # Container: Compose plugin
      - docker-model-plugin # Container: Model plugin
      - podman-machine # Podman: Machine management
      # - edk2-ovmf # VM: UEFI firmware (Bazzite pre-installed)
      - incus # VM/Container: Next-gen manager
      - incus-agent # VM: Incus guest agent
      # - libvirt # VM: Virtualization API (Bazzite pre-installed)
      - libvirt-nss # VM: Name service switch
      - virtiofsd # VM: VirtioFS daemon
      - lxc # Container: Linux Containers
      - osbuild-selinux # System: SELinux policies
      - qemu-img # VM: Image utilities
      - qemu-kvm # VM: KVM hypervisor
      - swtpm # VM: Software TPM
      - swtpm-tools # VM: TPM utilities
      - cloud-hypervisor # VM Engine: Rust-native VMM
      - crun-wasm # Container: OCI runtime for Wasm
      - virt-manager # VM: Desktop manager
      - virt-v2v # VM: V2V conversion
      - virt-viewer # VM: Graphical console

      # --- OS-Level Observability (eBPF & Trace Core) ---
      - bcc # eBPF: Collection tools
      - bpftop # eBPF: Dynamic monitoring
      - bpftrace # eBPF: High-level tracing language
      # - otel-ebpf-instrumentation # eBPF: OBI 1.0
      # - opentelemetry-collector # Collector: OBI 1.0
      - iotop # System: I/O monitor
      - nicstat # Network: Interface statistics
      - numactl # System: NUMA policy control
      - pcp # System: Performance Co-Pilot
      # - zeroboot # VM: Sub-millisecond snapshotting
      # - profile-bee # eBPF: Rust-based live CPU profiler
      - sysprof # System: Profiler
      - tiptop # System: Performance monitor
      - trace-cmd # System: Ftrace interface
      # - udica # SELinux: Container policy generator (Bazzite pre-installed)

      # --- Host Integration & Peripheral Bridges ---
      # - android-tools # Mobile: ADB & Fastboot
      # - dbus-x11 # OS: X11 bridge (Bazzite pre-installed)
      - flatpak-builder # Build: Host-level sandbox tools
      - git-subtree # VCS: Subtree management
      - git-svn # VCS: Legacy Subversion bridge
      # - intentrace # eBPF: Syscall intent observability
      # - kubearmor # Security: BPF-LSM runtime enforcement
      - libimobiledevice-utils # Mobile: iOS utilities
      # - libvfio # GPU: Mediated device orchestration
      - usbmuxd # Mobile: iOS bridge
      # - usecomputer # AI: GUI automation/Wayland bridge
      - util-linux-script # Terminal: Recording tools
      - waypipe # OS: Wayland network transparency
      # - ydotool # OS: Wayland input automation (Bazzite pre-installed)
      - zsh # Shell: Foundation

  - type: systemd
    system:
      enabled:
        - ublue-system-setup.service # https://github.com/ublue-os/packages/blob/main/packages/ublue-setup-services/src/services/ublue-system-setup.service
        - ublue-os-libvirt-workarounds.service # https://github.com/ublue-os/packages/blob/main/packages/ublue-os-libvirt-workarounds/src/usr/lib/systemd/system/ublue-os-libvirt-workarounds.service
        - swtpm-workaround.service # https://github.com/ublue-os/ucore/blob/main/ucore/system_files/usr/lib/systemd/system/swtpm-workaround.service
        - bazzite-dx-groups.service
        - cockpit.socket
        - docker.socket
        - podman.socket
        - uupd.timer
        - input-remapper.service
    user:
      enabled:
        - ublue-user-setup.service # https://github.com/ublue-os/packages/blob/main/packages/ublue-setup-services/src/user-services/ublue-user-setup.service

  # ==========================================
  # LAYER 2: WORKSTATION EXPERIENCE
  # ==========================================
  - type: fonts
    fonts:
      google-fonts:
        - Inter
        - Outfit
      nerd-fonts:
        - FiraCode
        - Hack
        - JetBrainsMono

  # ==========================================
  # LAYER 3: CUSTOMIZATIONS & LOGIC
  # ==========================================
  - type: dx-flavor
    source: local

  - type: dx-udev
    source: local

  - type: justfiles
    include:
      - 95-bazzite-dx.just
