# Base image pin: the single source of truth, consumed by the CI build, `just build`
# and the kmod-sign workflow. Updated by Renovate; `just check` asserts the Containerfile
# default matches this file.
#
# The Project NOMAD stack images are deliberately NOT listed here. They are pinned inline in
# the Quadlet units under files/system/etc/containers/systemd/users/, which is the artifact
# that actually ships — keeping a second copy here only created a way for the two to
# disagree. Renovate tracks those files directly via a customManager.
# The internal key stays `bazzite-nvidia` on purpose: maint.just, both workflows and
# Renovate select the pin by this name. The image it resolves to is the open-kernel
# flavour (kernel 7.2.x, driver 615), not the proprietary LTS one.
images:
  - name: bazzite-nvidia
    image: ghcr.io/ublue-os/bazzite-nvidia-open
    tag: 45.20261105
    digest: sha256:9c3c4df94a7731238021549ed3fc951c3ae5e1fee37667d16754f37ae0f73134
