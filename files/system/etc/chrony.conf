# Declarative NTP Configuration for bazzite-dx-silver-goggles
# Resilient multi-tier public NTP pools (Brazilian low latency + Fedora/global fallbacks)
pool pool.ntp.br iburst
pool 2.fedora.pool.ntp.org iburst
pool pool.ntp.org iburst

# Dynamic NTP sources pushed by NetworkManager / DHCP
sourcedir /run/chrony-dhcp

# Drift tracking and real-time clock synchronization
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync

# Drop-in configuration directory
confdir /etc/chrony.d

# Timezone leap seconds database & log directory
leapseclist /usr/share/zoneinfo/leap-seconds.list
logdir /var/log/chrony
