# Cockpit sits behind `tailscale serve`, and without this it rejects the WebSocket.
#
# I twice decided NOT to ship this file, on the grounds that Cockpit worked without it. Both
# times the measurement was real and covered the wrong thing: it looked at whether the login
# page loaded, never at the WebSocket upgrade that happens after you authenticate. The
# failure is invisible to curl and to any check short of an actual login:
#
#     cockpit-session: pam_unix(cockpit:session): session opened for user <username>(uid=1000)
#     cockpit-ws: received request from bad Origin: https://<tailscale-fqdn>:61390
#     cockpit-ws: Received invalid handshake request from the client
#
# Authentication succeeds. The handshake is what gets refused, and the browser reports it as
# "unexpected error connecting to the machine" — which reads like a backend fault and is not.
#
# The cause is the split introduced by proxying: tailscale terminates TLS and forwards plain
# HTTP to 127.0.0.1:61390, so Cockpit computes its expected origin from an http:// listener
# while the browser sends https://. They cannot match. It did not happen at 9090 because that
# access never went through the proxy at all — the browser reached Cockpit's own TLS directly,
# with a self-signed certificate it had been told to trust long ago.
#
# ProtocolHeader rather than an explicit Origins list, deliberately: Origins would mean
# hard-coding this machine's tailnet hostname into a system image, and it would silently stop
# matching if the tailnet name ever changed. Telling Cockpit which header carries the original
# scheme lets it derive the origin from the Host header it already receives. Verified that
# tailscale serve actually sends what this depends on, rather than assuming it:
#
#     Host: <tailscale-fqdn>:61395
#     X-Forwarded-Proto: https
#     X-Forwarded-Host: <tailscale-fqdn>:61395
#
# Safe because Cockpit only listens on loopback (see cockpit.socket.d/10-port.conf): nothing
# but the local proxy can reach it, so nothing untrusted is in a position to forge the header.
# If Cockpit is ever exposed on a routable address, this setting must be reconsidered — an
# attacker who can talk to it directly could then claim an encrypted origin it does not have.
[WebService]
ProtocolHeader = X-Forwarded-Proto
