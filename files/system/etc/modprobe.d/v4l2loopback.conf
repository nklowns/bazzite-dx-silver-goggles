# Multi-camera virtual device pool for Bazzite HOST (7 virtual cameras for remote-connection
# streams, plus one reserved slot for OBS Studio's own Virtual Camera feature).
#
# WHY 8 TOTAL, NOT 9 — MEASURED, NOT ASSUMED
# -------------------------------------------
# This build of v4l2loopback hard-caps video_nr/card_label at 8 array entries. A first attempt at
# devices=9 (to add OBS without shrinking the existing pool) failed insmod outright:
#   video_nr: can only take 8 arguments
#   v4l2loopback: `9' invalid for parameter `video_nr'
# So OBS's slot comes out of the existing 8, not on top of them — one less generic remote-cam
# slot (7 instead of 8), not a 9th device.
#
# WHY video_nr=9 IS FIRST, NOT AN AFTERTHOUGHT
# ---------------------------------------------
# The kernel only applies module options at insmod time — whichever caller (us, at boot, via
# modules-load.d, or OBS's virtualcam plugin, lazily on first "Start Virtual Camera") loads
# v4l2loopback first wins the parameters for the rest of the uptime; a later modprobe with
# different options is a silent no-op against an already-loaded module. Loading proactively at
# boot (see /usr/lib/modules-load.d/v4l2loopback.conf) settles who wins that race, but not which
# device OBS actually opens: OBS Studio has a long-standing bug (obsproject/obs-studio#4796) where
# its virtualcam plugin always grabs the FIRST enumerated v4l2loopback device, ignoring which one
# it was actually asked to use. Before this, that meant OBS would try to write to /dev/video10 —
# the slot webcam-receiver targets for a remote connection's camera (usually Windows, but the
# pool itself is remote-source-agnostic) — corrupting both streams simultaneously. Putting OBS's
# own slot (9) lowest in video_nr order makes "OBS always takes the first one" grab the device
# meant for it instead of colliding with the remote-source bridge.
options v4l2loopback devices=8 video_nr=9,10,11,12,13,14,15,16 card_label="OBS Virtual Camera","Cam-Virtual-1","Cam-Virtual-2","Cam-Virtual-3","Cam-Virtual-4","Cam-Virtual-5","Cam-Virtual-6","Cam-Virtual-7"
