monitor.bluez.properties = {
    # Restrict to classic BT codecs only.
    # PipeWire 1.6.4 sends UINT64 metadata for LC3plus/Opus A2DP endpoints;
    # bluez 5.86 expects INT64 → parse_int64_metadata fails → AVDTP corruption.
    bluez5.codecs = [ sbc sbc_xq aac aptx aptx_hd ]

    # Remove a2dp_sink role (PC as BT audio receiver).
    # Echo Dot 4 supports A2DP Source and will initiate AVDTP to the PC's A2DPSink
    # endpoint before the PC can establish a2dp-sink (PC→Echo Dot) → EBUSY.
    # Without a2dp_sink, only PC-initiated A2DP Source connections are possible.
    bluez5.roles = [ a2dp_source hsp_hs hfp_hf ]
}
