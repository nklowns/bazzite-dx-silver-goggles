# Enforce balanced low latency (35ms sweet spot) and route RustDesk to default audio sink
pulse.rules = [
  {
    matches = [
      { application.name = "~RustDesk.*" }
      { application.process.binary = "rustdesk" }
    ]
    actions = {
      update-props = {
        pulse.min.req = "512/48000"
        pulse.min.frag = "512/48000"
        pulse.min.quantum = "512/48000"
        node.latency = "1024/48000"
        node.max-latency = "2048/48000"
        target.object = "@DEFAULT_AUDIO_SINK@"
      }
    }
  }
]
