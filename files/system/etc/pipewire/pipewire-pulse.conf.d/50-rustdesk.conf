# Enforce low latency and route RustDesk recording streams to default audio sink
pulse.rules = [
  {
    matches = [
      { application.name = "~RustDesk.*" }
      { application.process.binary = "rustdesk" }
    ]
    actions = {
      update-props = {
        pulse.min.req = "256/48000"
        pulse.min.frag = "256/48000"
        pulse.min.quantum = "256/48000"
        node.latency = "512/48000"
        node.max-latency = "1024/48000"
        target.object = "@DEFAULT_AUDIO_SINK@"
      }
    }
  }
]
