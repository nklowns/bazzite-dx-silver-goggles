# open new windows in the current path
bind c new-window -c "#{pane_current_path}"
# reload config file
bind r source-file ~/.tmux.conf

# don't rename windows automatically
set-option -g allow-rename off
# Don't kill the session when last window closes
set -g destroy-unattached off

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# tmux adds a short, almost imperceptible delay between the commands that can cause funny behavior when running vim inside tmux.
set -sg escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Auto renumber windows on close
set -g renumber-windows on

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# allow focus events to get through to applications running in tmux
set -g focus-events on

# Allow tmux clipboard to copy to system clipboard
set -s set-clipboard on

# Increase history limit for long CLI output
set -g history-limit 10000

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Propagate environment variables for graphical session & agent tooling
set -ga update-environment " DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS TERM_PROGRAM"

# --- Modern TUI & Agent Protocol (Kitty Keyboard / CSI-u / OSC Passthrough) ---
# Unrestricted OSC/DCS sequence passthrough (progress bars, desktop notifications, images)
set -g allow-passthrough all

# Extended keys format CSI-u (Kitty Keyboard Protocol standard for modern agents like Pi, AGY, Claude Code)
set -s extended-keys on
set -s extended-keys-format csi-u

# System clipboard bidirectional sync (OSC 52 and terminal clipboard queries)
set -s set-clipboard on
set -s get-clipboard both

# Modern terminal features for outer emulators (xterm-compatible, Ghostty, Kitty, WezTerm)
set -as terminal-features 'xterm*:extkeys:RGB:clipboard:hyperlinks:osc52'
set -as terminal-features 'ghostty:extkeys:RGB:clipboard:hyperlinks:osc52'
set -as terminal-features 'kitty:extkeys:RGB:clipboard:hyperlinks:osc52'

# Explicit default terminal (prevents TERM regression)
set -g default-terminal "tmux-256color"
