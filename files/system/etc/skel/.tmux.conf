# open new windows in the current path
bind c new-window -c "#{pane_current_path}"
# reload config file
bind r source-file ~/.tmux.conf

# don't rename windows automatically
set-option -g allow-rename off
# Don't kill the session when last window closes
set -g destroy-unattached off

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# tmux adds a short, almost imperceptible delay between the commands that can cause funny behavior when running vim inside tmux.
set -sg escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Auto renumber windows on close
set -g renumber-windows on

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# allow focus events to get through to applications running in tmux
set -g focus-events on

# Allow tmux clipboard to copy to system clipboard
set -s set-clipboard on

# Increase history limit for long CLI output
set -g history-limit 10000

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Propagate environment variables for graphical session & agent tooling
set -ga update-environment " DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS"

# --- Claude Code / Modern TUI ---
# OSC sequences (progress bars, desktop notifications) pass through to outer terminal
set -g allow-passthrough on
# Shift+Enter inserts newline instead of submitting (requires outer terminal support)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# True 24-bit color (Claude Code TUI uses RGB — without this degrades to 256 palette)
set -as terminal-features 'xterm*:RGB'
# OSC 52: apps inside tmux can write to system clipboard (Claude Code output → clipboard)
set -as terminal-features 'xterm*:clipboard'
# OSC 8: clickable hyperlinks (file paths in Claude Code output become clickable)
set -as terminal-features 'xterm*:hyperlinks'
# Explicit default terminal (prevents TERM regression)
set -g default-terminal "tmux-256color"
