# Silver Goggles — Default Atuin Configuration
# Part of the Bazzite DX shell experience.
#
# This file was deployed to your home on first login.
# It's yours to edit — no future overrides will happen.
#
# Full reference: https://docs.atuin.sh/configuration/config/
# Key bindings:   Ctrl-R → interactive search  |  ↑ → project-scoped history

# Search mode for interactive search (fuzzy, prefix, fulltext)
search_mode = "fuzzy"

# Which filter mode to use by default.
# "host": commands run on this host only
# "global": search across all recorded history
# Note: Ctrl-R / F6 in the TUI cycles through filter modes dynamically.
filter_mode = "host"

# Which filter mode to use when atuin is invoked from a shell up-key binding.
# Workspace mode: searches history from the current git repository tree.
filter_mode_shell_up_key_binding = "workspace"
search_mode_shell_up_key_binding = "fuzzy"

# Auto-execute on enter
enter_accept = true

# UI Configuration
inline_height = 20
show_preview = true
max_preview_height = 3
show_help = true

[tmux]
# TMUX popup integration (disable if using mobile or constrained SSH clients)
enabled = true

[sync]
# Enable sync v2 records format
records = true
# Cloud sync is disabled by default.
# To enable: https://docs.atuin.sh/guide/sync/
# sync_address = "https://api.atuin.sh"

[search]
# Search across all shells (bash, fish, zsh) instead of hiding commands from other shells
shells = "all"
