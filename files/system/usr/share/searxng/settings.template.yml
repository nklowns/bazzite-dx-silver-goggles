# ==============================================================================
# SearXNG Metasearch Engine Configuration — 9 Search Spheres
# ==============================================================================
# Managed declaratively by Bazzite silver-goggles image & agent-mesh-bootstrap-env.
# 
# SPHERES (as declared in categories_as_tabs below):
# 1. Clearnet General: brave (api), google, mojeek, wikipedia, wikidata, duckduckgo,
#    + native-index: yandex, naver, bing
# 2. Dev & IT (:!it): github, gitlab, stackoverflow, arch linux wiki, pypi, npm, crates.io, docker hub, repology, nvd, huggingface, baidu kaifa
# 3. Science (:!science): arxiv, semantic scholar, annas archive
# 4. Indie & Small Web (:!indie): marginalia, neocities, mwmbl
# 5. P2P (:!p2p): mwmbl, yacy (remote public pool https://yacy.searchlab.eu)
# 6. Onions (:!onions): ahmia via internal Tor proxy (socks5h://tor:9050)
# 7. I2P (:!i2p): i2p search engines via the internal i2pd router proxies
# 8. Web Histórica & Arquivos (:!archive): openlibrary, loc, annas archive
# 9. Local (:!local): recoll Xapian index of the registered workspaces
#
# MULTILINGUAL SEARCH — measured 2026-11-10 on the G15 (JSON API, host exit).
# Scope is a fixed list of 10 target languages: pt-BR, en, ru, zh, ja, de, fr, es, ar, ko.
#
# `brave` (engine: braveapi) has no language-aware index: `language=ja|de|ru` and
# the `:ja` prefix returned the SAME results as the plain English query. The
# `language` filter is therefore not the lever; native queries are, and general
# fallbacks are what keep the 6 languages without a dedicated engine alive if
# brave is suspended.
#
# Coverage map (measured):
#   ru  yandex      'погода'         10 (gismeteo.ru)  · en 'weather' 10 · lang=pt-BR 10
#   ko  naver       '뉴스'            9 (news.naver.com) · en 'weather'  3 · lang=pt-BR  9
#   zh  baidu kaifa 'python asyncio' 10 (blog.csdn.net) — categoria it
#   zh  bing        '天气'           10  · 360search responde (6) mas custa +1.7 s (pt) / +4.7 s (zh)
#   ja/de/fr/es/ar/pt-BR/en via bing (fallback geral), 10 resultados cada, ~0.3 s:
#       '東京 天気' · 'Wetter Berlin' · 'météo Paris' · 'clima Madrid' ·
#       'أخبار اليوم' · 'previsão do tempo' · 'weather London'
#   baidu (general) devolve CAPTCHA / "HTTP connection error" do exit atual.
#   seznam (cs) timeout em 2 de 2 tentativas — cs está fora da lista de 10.
#   startpage nao e registrado por este build (ausente de searx.engines, 264 carregadas).
#
# TRAWL (anti-bot) — A/B medido no mesmo exit, `network: trawl` nestes motores:
#   baidu -> CAPTCHA · seznam -> CAPTCHA · 360search -> CAPTCHA (direto devolvia 6),
#   as tres em ~3 ms: o trawl respondeu "Suspended: CAPTCHA", ou seja, estava
#   recusando request, nao resolvendo. Ele já é o caminho declarado de
#   google/mojeek/wikipedia/wikidata/duckduckgo, e `google` continua "access
#   denied" mesmo por ele. Por isso os motores de índice nativo acima ficam
#   **diretos** de propósito — é medicao, nao descuido.
#
# CONTRATO DE IDIOMA: consultar no idioma que indexa o conteudo (query nativa) e
# responder no idioma pedido pelo chamador. O SearXNG nao traduz resultado; a
# obrigacao dele é nao descartar — por isso `languages` fica sem lista e
# `default_lang` herda `auto`. Medido: `language=pt-BR` + query nativa nao muda
# a contagem (yandex 10, naver 9, bing 10).
# ==============================================================================

use_default_settings: true

general:
  debug: false
  instance_name: "Agent Mesh SearXNG"

server:
  secret_key: "@SEARXNG_SECRET_KEY@"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: true
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
  # `default_lang` fica no herdado do use_default_settings (auto) e `languages`
  # continua sem lista, de proposito: chamada de API sem `language` nao pode ser
  # estreitada. Medido: motores de indice nativo mantem o resultado nativo mesmo
  # com `language=pt-BR`, entao curar a lista nao acrescentaria cobertura e
  # filtraria quem passa o proprio idioma.

valkey:
  url: redis://redis:6379/1

redis:
  url: redis://redis:6379/1

outgoing:
  request_timeout: 8.0
  max_request_timeout: 20.0
  useragent_suffix: "AgentMesh/1.0 (https://github.com/nklowns/bazzite-dx-silver-goggles)"
  pool_connections: 100
  enable_http2: true
  using_tor_proxy: false
  networks:
    tor:
      enable_http: true
      using_tor_proxy: true
      proxies:
        all://:
          - socks5h://tor:9050
    trawl:
      enable_http: true
      proxies:
        all://:
          - http://trawl:8192

categories_as_tabs:
  general:
  it:
  science:
  indie:
  p2p:
  onions:
  i2p:
  archive:
  local:

engines:
  # ==========================================
  # ESFERA 1: CLEARNET GERAL
  # ==========================================
  # startpage: NAO registrado por este build do SearXNG (ausente de searx.engines,
  # com 264 engines carregadas) — a stanza seria inerte, não apenas desligada.
  # Reavaliar a cada bump do SearXNG.
  - name: startpage
    disabled: true

  - name: lemmy communities
    network: trawl
    disabled: false

  - name: lemmy posts
    network: trawl
    disabled: false

  # brave (API): índice sem suporte a idioma — `language=xx` e o prefixo `:xx`
  # devolvem os mesmos resultados da query em inglês. Cobertura multilíngue vem
  # dos motores de índice nativo abaixo (yandex, naver, bing), não do parâmetro.
  - name: brave
    engine: braveapi
    api_key: "@BRAVE_API_KEY@"
    categories: [general, it]
    disabled: false
    weight: 2.0
    timeout: 3.5

  - name: google
    engine: google
    network: trawl
    categories: [general, it]
    disabled: false
    weight: 3
    timeout: 2.5

  - name: mojeek
    engine: mojeek
    categories: [general]
    network: trawl
    disabled: false

  - name: qwant
    disabled: true

  - name: wikipedia
    engine: wikipedia
    categories: [general]
    network: trawl
    disabled: false
    weight: 0.6

  - name: wikidata
    engine: wikidata
    categories: [general]
    network: trawl
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    categories: [general, it]
    network: trawl
    disabled: false
    weight: 1.5

  # --- Índices nativos (medidos 2026-11-10, saída deste host, sem trawl) ---
  # Respondem a query nativa e ignoram `language=pt-BR` sem perder resultado.
  # São o caminho para multilíngue; o parâmetro `language` não é.
  - name: yandex
    categories: [general]
    disabled: false
    timeout: 4.0

  - name: naver
    categories: [general, it]
    disabled: false
    weight: 1.2
    # 5.0: cold start mediu 2.3 s; 4.0 derrubou a primeira chamada por timeout.
    timeout: 5.0

  - name: bing
    categories: [general, it]
    disabled: false
    weight: 1.5
    timeout: 3.0

  # --- Rejeitados na medição: ficam desligados com o motivo, não por esquecimento ---
  - name: baidu
    disabled: true
    # CAPTCHA / "HTTP connection error" em chamadas consecutivas do exit atual.
  - name: seznam
    disabled: true
    # timeout em 2 de 2 tentativas (~30 s cada).
  - name: 360search
    disabled: true
    # Responde (6 resultados), mas custa +1.7 s numa agregação pt-BR e +4.7 s
    # numa zh, sem ganho de resultado. Habilitar sob demanda se precisar de zh.

  # Motores ruidosos desativados da categoria IT herdada
  - name: mdn
    disabled: true

  - name: baidu kaifa
    categories: [it]
    disabled: false
    # Índice nativo chinês, categoria it: 'python asyncio' -> 10 (blog.csdn.net).
    # Diferente de `baidu` (general), que devolve CAPTCHA do exit atual.

  - name: habrahabr
    disabled: true

  - name: free software directory
    disabled: true

  # ==========================================
  # ESFERA 2: DEV & IT (:!it)
  # ==========================================
  - name: hackernews
    network: trawl
    disabled: false
    weight: 2

  - name: github
    engine: github
    categories: [it]
    network: trawl
    disabled: false
    weight: 2

  - name: gitlab
    engine: gitlab
    categories: [it]
    network: trawl
    disabled: false
    weight: 1

  - name: stackoverflow
    engine: stackexchange
    api_site: stackoverflow
    categories: [it]
    network: trawl
    disabled: false
    weight: 2

  - name: arch linux wiki
    engine: archlinux
    categories: [it]
    network: trawl
    disabled: false
    weight: 2

  - name: pypi
    engine: pypi
    categories: [it]
    network: trawl
    disabled: false

  - name: npm
    engine: npm
    categories: [it]
    network: trawl
    disabled: false

  - name: crates.io
    engine: crates
    categories: [it]
    network: trawl
    disabled: false

  - name: docker hub
    engine: docker_hub
    categories: [it]
    network: trawl
    disabled: false

  - name: repology
    engine: repology
    categories: [it]
    network: trawl
    disabled: false

  - name: nvd
    engine: nvd
    categories: [it]
    network: trawl
    disabled: false

  - name: huggingface
    engine: huggingface
    categories: [it]
    network: trawl
    disabled: false

  # ==========================================
  # ESFERA 3: CIÊNCIA & ACADÊMICO (:!science)
  # ==========================================
  - name: openalex
    network: trawl
    disabled: false
    weight: 2

  - name: arxiv
    engine: arxiv
    categories: [science]
    network: trawl
    disabled: false
    weight: 2

  - name: semantic scholar
    engine: semantic_scholar
    categories: [science]
    network: trawl
    disabled: false
    weight: 2

  - name: annas archive
    engine: annas_archive
    categories: [archive, science]
    network: trawl
    disabled: false

  # ==========================================
  # ESFERA 4: INDIE & SMALL WEB (:!indie)
  # ==========================================
  - name: marginalia
    engine: marginalia
    categories: [indie, general]
    network: trawl
    disabled: false
    weight: 2

  - name: neocities
    engine: neocities
    categories: [indie]
    network: trawl
    disabled: false

  # ==========================================
  # ESFERA 5: P2P DESCENTRALIZADA & COMUNITÁRIA (Mwmbl & YaCy)
  # ==========================================
  - name: mwmbl
    engine: mwmbl
    categories: [p2p, general]
    network: trawl
    disabled: false
    weight: 2

  - name: yacy
    engine: yacy
    categories: [p2p]
    enable_http: true
    disabled: false
    timeout: 12.0
    base_url: https://yacy.searchlab.eu

  # ==========================================
  # ESFERA 6: DARKNET & PRIVACIDADE (:!onions)
  # ==========================================
  - name: ahmia
    engine: ahmia
    categories: [onions]
    network: tor
    enable_http: true
    using_tor_proxy: true
    disabled: false
    timeout: 20.0

  # ==========================================
  # ESFERA 7: WEB HISTÓRICA & ARQUIVOS (:!archive)
  # ==========================================
  - name: openlibrary
    engine: openlibrary
    categories: [archive, science]
    network: trawl
    disabled: false

  - name: z-library
    engine: zlibrary
    shortcut: zlib
    categories: [archive, science]
    network: trawl
    disabled: false

  - name: loc
    engine: loc
    shortcut: locgov
    categories: [archive]
    network: trawl
    disabled: false

  # ==========================================
  # ESFERA 8: DARKNET I2P (:!i2p)
  # ==========================================
  - name: legwork
    engine: xpath
    shortcut: i2p
    categories: [i2p]
    search_url: 'http://legwork.i2p/search?q={query}'
    url_xpath: '//div[@class="result"]//a/@href'
    title_xpath: '//div[@class="result"]//a/text()'
    content_xpath: '//div[@class="result"]//p/text()'
    enable_http: true
    proxies:
      all://:
        - http://i2pd:4444
    disabled: false
    timeout: 15.0

  # ==========================================
  # ESFERA 9: LOCAL WORKSPACE (:!local)
  # ==========================================
  - name: recoll
    engine: recoll
    shortcut: local
    categories: [local]
    base_url: http://recoll:8080
    mount_prefix: /export
    dl_prefix: file://@USER_HOME@
    search_dir: ""
    enable_http: true
    disabled: false
    timeout: 6.0




