# nomad-llama — example llama-swap config (optional DX layer).
#
# `ujust llama-up` copies this to ~/.config/llama-swap/config.yaml when that file does not exist.
# Edit it there (or replace it with your own/generated one); nomad-llama mounts it read-only at
# /app/config.yaml and llama-swap reloads it on in-place edits (-watch-config).
#
# Paths inside the container (see nomad-llama.container):
#   /app/llama-server      llama.cpp server, CUDA build
#   /models/gguf/<repo>/<file>   weights fetched by `ujust llama-models-fetch`
# Reference: https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml
#
# The default below mirrors the curated set for a 6 GB GPU (RTX 3060 Laptop): one model in VRAM at
# a time, MoE experts of the 35B kept in system RAM, MTP speculative decoding on the dense models.
# Measured on build b12004 (llama.cpp 0.8.0-dev): 4B prefill 2.2k tok/s and 738 tok/s on a
# copy-heavy edit (draft_mtp+ngram acceptance 680/680); 35B (MoE, --n-cpu-moe 40) 475 tok/s
# prefill and 47.8 tok/s on a 962-token edit (ngram-mod acceptance 616/713), 33.4 tok/s on novel
# text. Structured tool_calls OK on both.
#
# VRAM budget (measured on b12004, GPU idle, np1): 4B @49k ≈ 4.8 GiB with KV q8_0 · 35B @98k
# ≈ 5.5 GiB with KV f16 and the experts in system RAM. One chat model at a time — that is why they
# all sit on `ttl` instead of a group.
# The 4B keeps its vision projector on the CPU (`--no-mmproj-offload`): offloading the encoder is
# 11x faster (38 s → 3 s per 1080p screenshot) but does not fit together with MTP at -c 49152
# (~5.7 GiB, OOM). With q4_0 KV it fits by 15 MiB — i.e. inside the 900 MiB reserve — and doubles
# KV divergence (KLD 0.0118 vs 0.0051 for q8_0), so it is still not worth it. Drop to -c 32768 if a
# vision-heavy workload ever justifies it (measured 3.0 s per 1200x700 image there).

healthCheckTimeout: 600
logLevel: info

models:
  "qwen3.5-4b":
    cmd: |
      /app/llama-server --port ${PORT} --host 127.0.0.1 --jinja -ngl 999
      -m /models/gguf/unsloth/Qwen3.5-4B-MTP-GGUF/Qwen3.5-4B-UD-Q4_K_XL.gguf
      -c 49152 -fa on -t 6 -C 0x555 --cpu-strict 1 -np 1 -ctk q8_0 -ctv q8_0
      --cache-prompt --cache-reuse 256 --no-cache-idle-slots
      --mmproj /models/gguf/unsloth/Qwen3.5-4B-MTP-GGUF/mmproj-F16.gguf --no-mmproj-offload
      --spec-type draft-mtp,ngram-mod --spec-draft-n-max 2 -ctkd q8_0 -ctvd q8_0
      --reasoning-budget 2500
    # Thinking off by default (fast agent turns); request "qwen3.5-4b:think" to enable it on the
    # same loaded process.
    filters:
      setParams: {"chat_template_kwargs": {"enable_thinking": false}}
      setParamsByID: {"${MODEL_ID}:think": {"chat_template_kwargs": {"enable_thinking": true}}}
    ttl: 600

  # No 9B tier on purpose. A 9B at Q3_K_M (the only quant that fits 6 GB with the desktop resident)
  # tops out at a 16k window — 14 336 tokens after the template — which is smaller than a long
  # agent system prompt (measured 15 559 on a real one). It was retired from the curated set for
  # that reason; see the retired catalog entry for the weights.

  # 35B-A3B (MoE, ~3B active per token) — quality/vision tier. 98k window, experts in system RAM
  # via --n-cpu-moe, KV at f16 (the only persona that does: q8_0 halves it to 4567 MiB and opens
  # -c 131072 for ~0.2 t/s, but its KV quality on this abliterated MoE is not measured yet).
  # Prefill is slow by design; it is the quality tier.
  "qwen3.6-35b":
    cmd: |
      /app/llama-server --port ${PORT} --host 127.0.0.1 --jinja -ngl 999
      -m /models/gguf/huihui-ai/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF/Huihui-Qwen3.6-35B-A3B-abliterated-ggml-model-Q4_K.gguf
      -c 98304 -fa on --n-cpu-moe 40 -t 6 -C 0x555 --cpu-strict 1 -b 2048 -ub 2048 -np 1
      -ctk f16 -ctv f16 --cache-prompt --cache-reuse 256 --no-cache-idle-slots
      --mmproj /models/gguf/ggml-org/Qwen3.6-35B-A3B-GGUF/mmproj-Qwen3.6-35B-A3B-Q8_0.gguf
      --spec-type ngram-mod --image-max-tokens 1536
    ttl: 600
    unloadTimeout: 30

  # Embedding model for RAG (Project NOMAD, Vane, anything OpenAI-compatible). The name is what the
  # NOMAD Command Center hard-codes (EMBEDDING_MODEL_NAME); vectors match Ollama's nomic-embed-text
  # (cosine >= 0.99999), so an index built with Ollama keeps working.
  #  - CUDA_VISIBLE_DEVICES= keeps it 100% on the CPU: with -ngl 0 the CUDA backend would still
  #    allocate its compute buffer on the GPU and fail next to a loaded chat model.
  #  - embeddings need the whole input in one ubatch, and -np 1 keeps -c from being split per slot.
  #    The model itself was trained for 2048 tokens; longer inputs get an error (Ollama truncates).
  "nomic-embed-text:v1.5":
    cmd: |
      /app/llama-server --port ${PORT} --host 127.0.0.1 -ngl 0
      -m /models/gguf/nomic-ai/nomic-embed-text-v1.5-GGUF/nomic-embed-text-v1.5.f16.gguf
      --embeddings --pooling mean -c 8192 -np 1 -b 8192 -ub 8192 -t 4
    env:
      - "CUDA_VISIBLE_DEVICES="
    # `task` is read by `ujust vane-llama-sync` (llama-swap reserves `type`).
    metadata: {"task": "embedding", "dims": 768}
    ttl: 0

# The embedding model lives in its own persistent group, so loading or swapping a chat model on the
# GPU never unloads it (and it never takes VRAM from the chat model).
routing:
  router:
    use: group
    settings:
      groups:
        embeddings:
          swap: false
          exclusive: false
          persistent: true
          members: ["nomic-embed-text:v1.5"]
