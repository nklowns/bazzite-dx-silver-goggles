[Unit]
# The stock unit guards on ConditionPathExistsGlob=/dev/nvidia*, and on this laptop that
# check loses a race it was never ordered against. /usr/lib/udev/rules.d/60-nvidia.rules
# says it outright — "Device nodes are created by nvidia-modprobe" — and creates them from
# `ACTION=="add|bind", KERNEL=="nvidia", RUN+="/usr/bin/nvidia-modprobe"`. Nothing orders
# this unit after that event, so the condition is evaluated against a /dev that has no
# nvidia nodes yet. Measured on boot 2026-07-28 11:04:01:
#
#     nvidia-persistenced.service - NVIDIA Persistence Daemon
#       Active: inactive (dead)
#       Condition: start condition unmet
#         └─ ConditionPathExistsGlob=/dev/nvidia* was not met
#
# …while /dev/nvidia0, /dev/nvidiactl and /dev/nvidia-uvm were all present later in the
# same session. The daemon therefore never ran and /run/nvidia-persistenced/ was never
# created. That is not cosmetic: /etc/cdi/nvidia.yaml mounts that socket into every
# GPU container, so the whole CDI path dies on it —
#
#     $ podman run --rm --device nvidia.com/gpu=all alpine ls /dev
#     Error: crun: cannot stat `/run/nvidia-persistenced/socket`: No such file or directory
#
# Do NOT "fix" this by polling for /dev/nvidia0 in ExecStartPre. A poll still loses when
# the nodes only appear on first use (nvidia-modprobe is invoked by the DDX/CUDA client,
# which may be minutes into the session), and clearing the condition without a replacement
# turns a cleanly-skipped unit into a failed one on any boot without the dGPU.
#
# Swap the racy node check for a module check that is already true this early. The kernel
# cmdline carries `rd.driver.pre=nvidia nvidia_drm nvidia_modeset nvidia_peermem nvidia_uvm`,
# so nvidia.ko is loaded inside the initramfs, long before any unit is evaluated. The same
# journal that recorded the skip proves both halves of this:
#
#     06:38:51  kernel: NVRM: loading NVIDIA UNIX x86_64 Kernel Module 580.173.02
#     09:38:59  systemd[1]: nvidia-persistenced.service … skipped, unmet condition check
#                           ConditionPathExistsGlob=/dev/nvidia*
#
# Module up, nodes absent, same boot — which is exactly why /sys/module/nvidia is a sound
# guard where /dev/nvidia* is not. Then create the nodes here rather than waiting on udev.
ConditionPathExistsGlob=
ConditionPathExists=/sys/module/nvidia

[Service]
# Same binary 60-nvidia.rules calls, invoked deterministically instead of racing its
# side effect. Verified idempotent: exits 0 whether or not the nodes already exist.
# The '+' runs it with full privileges rather than as User=nvidia-persistenced, so this
# keeps working if upstream ever adds NoNewPrivileges= (which would neuter the setuid bit).
ExecStartPre=+/usr/bin/nvidia-modprobe -c 0 -u
