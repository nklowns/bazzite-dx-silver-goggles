[Socket]
# Move Cockpit off 9090 and into this layer's reserved DX-service range (61300-61399).
#
# 9090 is not a quiet port on a developer workstation: it is Prometheus' default and a common
# pick for ad-hoc servers. And cockpit.socket holds it whether or not anyone is using Cockpit —
# measured, `ss -tlnp` shows `LISTEN *:9090` on an idle boot — so a project that wants 9090
# loses, silently, to a service the user may not remember having.
#
# The empty assignment is required, not decorative. ListenStream is a list, so a drop-in that
# only adds 61390 leaves the inherited 9090 in place and Cockpit ends up on BOTH ports —
# which looks like success while fixing nothing. Resetting first is the whole point.
ListenStream=
ListenStream=127.0.0.1:61390

# LOOPBACK, not the wildcard the stock unit uses, and this is the half of the change that was
# missing at first. `tailscale serve --https=61390 61390` has to bind the tailnet address on
# that port to terminate TLS; with Cockpit holding [::]:61390 it cannot, and says so only in
# its own journal:
#
#     tailscaled: localListener failed to listen on 100.108.150.113:61390,
#                 backing off: bind: address already in use
#
# The browser then reaches Cockpit directly instead of through the proxy, gets the
# self-signed certificate from /etc/cockpit/ws-certs.d/, and refuses the handshake —
# surfacing as `cockpit-tls: gnutls_handshake failed` and a Cockpit error page that blames
# the connection to the machine. Binding loopback is also what code-server already does
# (`bind-addr: 127.0.0.1:61337`), which is why it never hit this: serve is the single
# controlled entrance, and the service is not incidentally exposed on every interface.
#
# Consequence worth stating: Cockpit is no longer reachable from the LAN at all, only through
# the tailnet proxy. On a tailscale-first machine that is the intent, not a regression.
#
# Deliberately NOT shipping /etc/cockpit/cockpit.conf with an Origins= entry alongside this.
# The reflex is to add one because Cockpit's origin check bites behind reverse proxies, but
# measured on this host: no cockpit.conf exists at all, `tailscale serve --https=9090 9090` is
# live, and the tailnet URL works. Tailscale passes the Host header through and the scheme is
# handled without help, so the only variable this change moves is the port number. Shipping a
# config file to pre-empt a problem that is not occurring would bake in a second place to keep
# in sync for no measured benefit. If an origin error ever does appear after this move, the
# knob is:
#     [WebService]
#     Origins = https://<host>:61390 wss://<host>:61390
# Zero boot cost either way: cockpit.socket is socket-activated, so this only changes which
# port the listener binds — cockpit-ws still spawns on first connection.
