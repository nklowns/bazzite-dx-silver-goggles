[Unit]
# `nvidia-ctk cdi generate` writes a spec that mirrors the live system, so WHEN it runs
# decides what ends up in /etc/cdi/nvidia.yaml. With nvidia-persistenced down it silently
# omits the /run/nvidia-persistenced/socket mount; with it up, the mount is included.
# Both specs "work" in the sense that they generate — but they are not equivalent, and a
# spec generated at the wrong moment is exactly how the current /etc/cdi/nvidia.yaml ended
# up referencing a socket that no boot ever creates.
#
# The stock unit only has After=local-fs.target, which leaves this to chance. Order it
# explicitly, and pull the daemon in so generation never happens in the degraded window.
After=nvidia-persistenced.service
Wants=nvidia-persistenced.service
