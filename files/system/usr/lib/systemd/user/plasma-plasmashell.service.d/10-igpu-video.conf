# Video wallpapers (Smart Video Wallpaper Reborn → QtMultimedia/FFmpeg) pick NVDEC/CUDA by default and pin
# ~390 MiB of dGPU VRAM per screen (measured 2026-10-05, Dell G15 5520). Decode them on the Intel iGPU via
# VAAPI instead, so the dGPU stays free for games and the local LLM. The eDP panel is wired to the iGPU and
# KWin composites there, so this also saves a cross-GPU copy. Without an Intel GPU libva fails and Qt falls
# back to software decode (no breakage).
[Service]
Environment=QT_FFMPEG_DECODING_HW_DEVICE_TYPES=vaapi
Environment=LIBVA_DRIVER_NAME=iHD
