# Netfilter modules the container engines need present before they start.
# dockerd normally modprobes these itself; when it doesn't, its iptables chains come
# up incomplete and every container on docker0 loses egress — no DNS, no TCP, not even
# the bridge gateway. Declaring them here makes the state deterministic at boot instead
# of dependent on daemon start order.
iptable_nat
# Bridged frames only traverse iptables when br_netfilter is loaded; without it
# /proc/sys/net/bridge/bridge-nf-call-iptables does not even exist.
br_netfilter
