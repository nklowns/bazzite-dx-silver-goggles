# Storage tree for Project NOMAD. Owner/mode and btrfs nodatacow (+C) are declared
# declaratively. The SELinux label and CACHEDIR.TAG are applied by ConfigureNomadStorage()
# in files/system/usr/libexec/bazzite-dx-groups.
#
# uid/gid 1000 rather than root: the stack runs under ROOTLESS podman, so every container
# writes as the desktop user. A root-owned tree would simply be unwritable. The numeric uid
# is the pattern the base image already uses for its most visible feature — see
# /usr/lib/tmpfiles.d/homebrew.conf from uBlue:
#     d /var/lib/homebrew   0755 1000 1000 - -
#     d /var/cache/homebrew 0755 1000 1000 - -
# A username cannot be used here (it varies per install and tmpfiles has no way to ask), and
# uid 1000 is the first human account on any Fedora system. If 1000 is wrong on some host,
# that host's Homebrew is already broken before NOMAD ever runs.
#
# Layout is FLAT, not nested. _resolveHostStorageRoot() (admin/app/services/docker_service.ts:505)
# resolves the admin's /app/storage bind and rewrites every child app's bind underneath it, so
# a database living inside storage/ would be counted as offline content by the UI's disk-usage
# view and content browser — and be in reach of a content reset.
d /var/srv/nomad 0755 1000 1000 -
d /var/srv/nomad/storage 0755 1000 1000 -
d /var/srv/nomad/mysql 0755 1000 1000 -
h /var/srv/nomad/mysql - - - - +C
d /var/srv/nomad/redis 0755 1000 1000 -
h /var/srv/nomad/redis - - - - +C
d /var/srv/nomad/ollama 0755 1000 1000 -
h /var/srv/nomad/ollama - - - - +C
