# Storage directory for self-hosted RustDesk Server (hbbs/hbbr).
# Owner uid/gid 1000 (desktop user) for rootless podman.
# Private mode 0700, Btrfs nodatacow (+C) for SQLite WAL, and 0600 host key.
d /var/srv/rustdesk 0700 1000 1000 -
h /var/srv/rustdesk - - - - +C
z /var/srv/rustdesk/id_ed25519 0600 1000 1000 -
