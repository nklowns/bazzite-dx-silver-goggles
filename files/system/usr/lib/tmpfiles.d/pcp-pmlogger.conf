# Performance Co-Pilot (PCP) pmlogger storage
# Disable copy-on-write (+C) on Btrfs to prevent NVMe extent fragmentation and write amplification
d /var/log/pcp/pmlogger 0775 pcp pcp - -
h /var/log/pcp/pmlogger - - - - +C

# Dell G15 Hardware Sensors Exporter for PCP OpenMetrics PMDA
d /var/lib/pcp/pmdas/openmetrics/config.d 0755 root root - -
L+ /var/lib/pcp/pmdas/openmetrics/config.d/g15_sensors.sh - - - - /usr/libexec/g15-sensors-exporter

