# libvirt-daemon-driver-secret ships /var/lib/libvirt/secrets in its payload, but
# ostree does not materialize /var from RPM: on a fresh deployment the directory is
# missing and virt-secret-init-encryption.service fails at boot.
#
# Observed on Fedora 45 (libvirt 12.6.0-2.fc45): failure was
# "Failed to create mount point '/var/lib/libvirt/secrets'". Creating it at boot
# time through tmpfiles.d is the declarative fix; doing it by hand in the running
# system only survives until the next host where the image is deployed.
d /var/lib/libvirt/secrets 0700 root root -
