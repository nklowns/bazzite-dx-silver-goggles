# Storage tree for SearXNG and Vane (AI Search / Agent Mesh).
# Owner/mode and btrfs nodatacow (+C) are declared declaratively.
# SELinux container_file_t context applied by ConfigureAiSearchStorage() in bazzite-dx-groups.
d /var/srv/searxng 0755 1000 1000 -
d /var/srv/vane 0755 1000 1000 -
d /var/srv/vane/data 0755 1000 1000 -
h /var/srv/vane/data - - - - +C
d /var/srv/yacy 0755 1000 1000 -
d /var/srv/yacy/DATA 0755 1000 1000 -
h /var/srv/yacy/DATA - - - - +C
