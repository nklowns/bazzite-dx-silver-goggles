# Prevent NetworkManager from managing Tailscale tun interfaces.
# If NetworkManager manages tailscale0, it pushes empty DNS configurations
# to systemd-resolved, breaking MagicDNS (100.100.100.100 / *.ts.net resolution).

[keyfile]
unmanaged-devices=interface-name:tailscale*

[device-tailscale]
match-device=interface-name:tailscale*
managed=0
