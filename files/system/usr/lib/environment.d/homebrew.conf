# Bazzite-DX: Homebrew system-wide environment
# Extracted by brew-setup.service on first boot from /usr/share/homebrew.tar.zst
# Applies to all users: interactive shells, GUI apps, IDE tasks, systemd services.

# Standard Homebrew variables — needed by any tool that checks HOMEBREW_PREFIX
# NOTE: PATH is NOT modified here. systemd environment.d does not reliably expand
# ${PATH} at this stage. PATH is set per-shell: brew.sh (bash/zsh) and ublue-brew.fish.
# (e.g. bling.sh completions, IDE extensions, non-interactive scripts)
HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew
HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar
HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew
