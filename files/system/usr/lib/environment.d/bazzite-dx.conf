# Bazzite-DX Global Environment Defaults
# These are baked into the image and apply to all users and sessions.
# Users can override these in ~/.config/environment.d/*.conf or /etc/environment.d/*.conf

# Standard Developer Experience variables
DX_VERSION=1.0
BAZZITE_DX_LAYER=true

# Atuin deterministic host identity (prevents transient hostname / MagicDNS fragmentation)
ATUIN_HOST_NAME=bazzite
