---
name: Build Bazzite DX Silver Goggles
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  repository_dispatch:
    types:
      - build
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install shell interpreters for syntax checks
        run: sudo apt-get update -q && sudo apt-get install -qy zsh fish

      - name: Install blue-build CLI
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh)
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validation
        run: just check

  bluebuild:
    name: Build Custom Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Generate Recipe
        run: just generate-recipe "bazzite-nvidia" "latest"

      - name: Build Custom Image
        uses: blue-build/github-action@836161eb076426a451e6a0054f722b1153b8b3ad # v1.12.0
        with:
          recipe: build-recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true
          maximize_build_space: true
          use_cache: true
          rechunk: false
          build_chunked_oci: false
          # Custom build options (conditional signing)
          build_opts: "${{ secrets.SIGNING_SECRET == '' && '--no-sign' || '' }}"
