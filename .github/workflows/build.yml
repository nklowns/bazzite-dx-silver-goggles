---
name: Build Bazzite DX Silver Goggles
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"
  repository_dispatch:
    types:
      - build
  workflow_dispatch: # allow manually triggering builds
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Surface Recipe
        run: |
          set -ex
          # 1. Resolve Base Image from image-versions.yaml
          export TARGET_IMAGE="bazzite-nvidia"
          export BASE_IMAGE=$(yq ".images[] | select(.name == \"${TARGET_IMAGE}\") | .image" image-versions.yaml)
          export BASE_TAG=$(yq ".images[] | select(.name == \"${TARGET_IMAGE}\") | .tag" image-versions.yaml)
          export BASE_DIGEST=$(yq ".images[] | select(.name == \"${TARGET_IMAGE}\") | .digest" image-versions.yaml)

          if [[ -n "$BASE_DIGEST" && "$BASE_DIGEST" != "null" ]]; then
            export IMAGE_VERSION_VAL="${BASE_TAG}@${BASE_DIGEST}"
          else
            export IMAGE_VERSION_VAL="${BASE_TAG}"
          fi

          # 2. Metadata
          export IMAGE_NAME="bazzite-dx-silver-goggles"
          export IMAGE_DESC="Personal DX layer for Dell G15 5520. KDE/NVIDIA — Slim Edition."
          export ARTIFACTHUB_LOGO_URL="https://avatars.githubusercontent.com/u/187439889?s=200&v=4"

          # 3. Patch Recipe
          yq -i '
            .name = env(IMAGE_NAME) |
            .description = env(IMAGE_DESC) |
            .base-image = env(BASE_IMAGE) |
            .image-version = env(IMAGE_VERSION_VAL)
          ' recipes/recipe.yml

          yq -i '
            .alt-tags = (["latest", "stable", env(BASE_TAG)] | unique) |
            .labels."io.artifacthub.package.logo-url" = env(ARTIFACTHUB_LOGO_URL) |
            .labels."io.artifacthub.package.readme-url" = "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md" |
            .labels."io.artifacthub.package.maintainers" = "[{\"name\": \"nklowns\", \"email\": \"nklowns@users.noreply.github.com\"}]" |
            .labels."io.artifacthub.package.keywords" = "bootc,bazzite,dx,silver-goggles,dell-g15,ublue,universal-blue,fedora,gaming,developer" |
            .labels."io.artifacthub.package.deprecated" = "false" |
            .labels."io.artifacthub.package.prerelease" = "false" |
            .labels."containers.bootc" = "1" |
            .labels."org.opencontainers.image.vendor" = "${{ github.repository_owner }}" |
            .labels."org.opencontainers.image.licenses" = "Apache-2.0" |
            .labels."org.opencontainers.image.url" = "https://github.com/${{ github.repository }}" |
            .labels."org.opencontainers.image.documentation" = "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md" |
            .labels."org.opencontainers.image.version" = "" + env(BASE_TAG) + "." + "'$(date +%Y%m%d)'" |
            .labels."org.opencontainers.image.revision" = "'${GITHUB_SHA}'"
          ' recipes/recipe.yml

          cp recipes/recipe.yml recipes/build-recipe.yml

      - name: Build Custom Image
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11
        with:
          recipe: build-recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true
          maximize_build_space: true
          rechunk: false
          build_chunked_oci: true
          # Custom build options (conditional signing)
          build_opts: "${{ secrets.SIGNING_SECRET == '' && '--no-sign' || '' }}"
