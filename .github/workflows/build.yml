---
name: Build Bazzite DX Silver Goggles
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  repository_dispatch:
    types:
      - build
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install shell interpreters for syntax checks
        run: sudo apt-get update -q && sudo apt-get install -qy zsh fish

      - name: Validation
        run: just check

  kmod:
    name: Sign gpu-unlock kmod
    uses: ./.github/workflows/kmod-sign.yml
    secrets: inherit

  publish:
    name: Build, verify and publish
    needs: [check, kmod]
    # Fail-soft: a failed/skipped kmod job yields an image without the unlock,
    # never a broken build.
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v1.1.0

      - name: Stage signed gpu-unlock kmod
        # The sign job only runs on main. A missing artifact must not fail the
        # build: modules/gpu-unlock skips with a warning.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpu-unlock-kmod
          path: files/system/usr/share/silver-goggles/kmod-staging

      - name: Resolve pinned base
        id: base
        run: |
          set -euo pipefail
          img=$(yq '.images[] | select(.name == "bazzite-nvidia") | .image' image-versions.yaml)
          tag=$(yq '.images[] | select(.name == "bazzite-nvidia") | .tag' image-versions.yaml)
          sha=$(yq '.images[] | select(.name == "bazzite-nvidia") | .digest' image-versions.yaml)
          {
            echo "image=$img"
            echo "tag=$tag"
            echo "digest=$sha"
          } >>"$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build with podman
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          version="${BASE_TAG}.$(date -u +%Y%m%d)"
          podman build \
            --build-arg BASE_IMAGE_REF="${{ steps.base.outputs.image }}:${BASE_TAG}@${{ steps.base.outputs.digest }}" \
            --build-arg IMAGE_VERSION="${version}" \
            --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
            --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t local/silver-goggles .

      - name: Verify image contents
        run: bash scripts/verify-image.sh local/silver-goggles

      - name: Decide whether to publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$PR_HEAD" != "$GITHUB_REPOSITORY" ]; then
              echo "publish=false" >>"$GITHUB_OUTPUT"
              echo "Fork PR: build only, no push and no signing."
              exit 0
            fi
            echo "publish=true" >>"$GITHUB_OUTPUT"
          elif [ "$REF" = "refs/heads/main" ]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "Ref $REF is not main: build only."
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push tags
        id: push
        if: steps.publish.outputs.publish == 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          os_version="${BASE_TAG%%.*}"
          timestamp="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=7 HEAD)"

          # Same tag matrix the BlueBuild action produced, so existing consumers
          # (latest, latest-45, stable, dated tags, cache keyed by os version)
          # keep working.
          if [ "$EVENT" = "pull_request" ]; then
            tags=(
              "pr-${PR_NUMBER}-latest-${os_version}" "${short_sha}-latest-${os_version}"
              "pr-${PR_NUMBER}-stable-${os_version}" "${short_sha}-stable-${os_version}"
              "pr-${PR_NUMBER}-${BASE_TAG}-${os_version}" "${short_sha}-${BASE_TAG}-${os_version}"
            )
          else
            tags=(
              latest "latest-${os_version}" "${timestamp}-latest-${os_version}" "${short_sha}-latest-${os_version}"
              stable "stable-${os_version}" "${timestamp}-stable-${os_version}" "${short_sha}-stable-${os_version}"
              "${BASE_TAG}" "${BASE_TAG}-${os_version}" "${timestamp}-${BASE_TAG}-${os_version}" "${short_sha}-${BASE_TAG}-${os_version}"
            )
          fi

          podman manifest create "${registry}:${tags[0]}" local/silver-goggles
          for tag in "${tags[@]}"; do
            echo "Pushing ${registry}:${tag}"
            podman manifest push --compression-format=gzip \
              --digestfile="/tmp/digest.${tag}" \
              "${registry}:${tags[0]}" "docker://${registry}:${tag}"
          done

          digest="$(cat "/tmp/digest.${tags[0]}")"
          for tag in "${tags[@]}"; do
            pushed="$(cat "/tmp/digest.${tag}")"
            if [ "$pushed" != "$digest" ]; then
              echo "::error::digest mismatch for ${tag}: ${pushed} != ${digest}"
              exit 1
            fi
          done
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "Pushed $((${#tags[@]})) tags at ${digest}"

      - name: Sign and verify
        if: steps.publish.outputs.publish == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="${{ steps.push.outputs.digest }}"

          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            if [ "$REF" = "refs/heads/main" ]; then
              echo "::error::SIGNING_SECRET is missing on main; refusing to publish an unsigned image."
              exit 1
            fi
            echo "::warning::No signing secret; PR image left unsigned."
            exit 0
          fi

          # --recursive is load-bearing: containers/image verifies the platform
          # manifest digest, and without signing the children the host rejects
          # the image even when the index signature is valid.
          COSIGN_PASSWORD='' COSIGN_YES='true' cosign sign \
            --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            --recursive "${registry}@${digest}"

          cosign verify --key cosign.pub "${registry}@${digest}"
