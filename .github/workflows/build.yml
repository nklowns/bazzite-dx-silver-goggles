---
name: Build Bazzite DX Silver Goggles
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  repository_dispatch:
    types:
      - build
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install blue-build CLI
        run: |
          podman run --pull always --rm ghcr.io/blue-build/cli:latest-installer | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validation
        run: just check

  bluebuild:
    name: Build Custom Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          extra-squeeze: true

      - name: Mount BTRFS loopback for podman storage
        continue-on-error: true
        run: |
          set -xe
          sudo apt-get update && sudo apt-get install -y btrfs-progs
          sudo modprobe btrfs || true
          TARGET_DIR="/var/lib/containers"
          LOOPBACK_DIR="/mnt/btrfs_loopbacks"
          LOOPBACK_FILE="${LOOPBACK_DIR}/containers.img"
          sudo mkdir -p "${TARGET_DIR}"
          sudo mkdir -p "${LOOPBACK_DIR}"
          AVAILABLE_SPACE=$(df -B1 / | awk 'NR==2 {print $4}' || echo "0")
          echo "Available space on /: $((AVAILABLE_SPACE / 1024 / 1024 / 1024)) GB"
          LOOPBACK_SIZE=$((AVAILABLE_SPACE * 85 / 100))
          # Fallback to 50GB if parsed size is less than 10GB
          if [ -z "${AVAILABLE_SPACE}" ] || [ "${LOOPBACK_SIZE}" -lt $((10 * 1024 * 1024 * 1024)) ]; then
            echo "Warning: df parsed space is invalid or too small. Falling back to 50 GB."
            LOOPBACK_SIZE=$((50 * 1024 * 1024 * 1024))
          fi
          MAX_SIZE=$((70 * 1024 * 1024 * 1024))
          if [ "${LOOPBACK_SIZE}" -gt "${MAX_SIZE}" ]; then
            LOOPBACK_SIZE=${MAX_SIZE}
          fi
          echo "Creating loopback file of size: $((LOOPBACK_SIZE / 1024 / 1024 / 1024)) GB"
          sudo truncate -s "${LOOPBACK_SIZE}" "${LOOPBACK_FILE}"
          sudo mkfs.btrfs -f "${LOOPBACK_FILE}"
          sudo systemd-mount "${LOOPBACK_FILE}" "${TARGET_DIR}" --options="compress-force=zstd:2,discard=async"
          df -h "${TARGET_DIR}"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Generate Recipe
        run: just generate-recipe "bazzite-nvidia" "latest"

      - name: Build Custom Image
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11.1
        with:
          recipe: build-recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true
          maximize_build_space: false
          rechunk: false
          build_chunked_oci: false
          # Custom build options (conditional signing)
          build_opts: "${{ secrets.SIGNING_SECRET == '' && '--no-sign' || '' }}"
