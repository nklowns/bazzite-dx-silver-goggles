---
name: Build Bazzite DX Silver Goggles
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  repository_dispatch:
    types:
      - build
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main publish in flight: it may already have moved tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Just
        id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Just from crates.io (fallback)
        # The action downloads from the GitHub API, which returned 504 twice
        # and blocked publishing. crates.io is an independent path.
        if: steps.just.outcome != 'success'
        run: |
          set -euo pipefail
          command -v just >/dev/null && exit 0
          cargo install just --locked

      - name: Install shell interpreters for syntax checks
        run: sudo apt-get update -q && sudo apt-get install -qy zsh fish

      - name: Validation
        run: just check

  kmod:
    name: Sign gpu-unlock kmod
    uses: ./.github/workflows/kmod-sign.yml
    secrets: inherit

  # Build, verify and push the versioned tags. No secret is used here, so it
  # can run for pull requests as well.
  publish:
    name: Build, verify and push
    needs: [check, kmod]
    # Fail-soft: a failed/skipped kmod job yields an image without the unlock.
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      os_version: ${{ steps.base.outputs.os_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v1.1.0

      - name: Stage signed gpu-unlock kmod
        # Main must ship the unlock: a missing artifact fails the release.
        # Pull requests have no artifact because signing only runs on main.
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpu-unlock-kmod
          path: files/system/usr/share/silver-goggles/kmod-staging

      - name: Resolve pinned base
        id: base
        run: |
          set -euo pipefail
          img=$(yq '.images[] | select(.name == "bazzite-nvidia") | .image' image-versions.yaml)
          tag=$(yq '.images[] | select(.name == "bazzite-nvidia") | .tag' image-versions.yaml)
          sha=$(yq '.images[] | select(.name == "bazzite-nvidia") | .digest' image-versions.yaml)
          {
            echo "image=$img"
            echo "tag=$tag"
            echo "digest=$sha"
            echo "os_version=${tag%%.*}"
          } >>"$GITHUB_OUTPUT"

      - name: Build with podman
        timeout-minutes: 25
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          version="${BASE_TAG}.$(date -u +%Y%m%d)"
          extra=()
          if podman build --help 2>&1 | grep -q -- '--rewrite-timestamp'; then
            extra=(--source-date-epoch "$(git log -1 --format=%ct)" --rewrite-timestamp)
          fi
          podman build "${extra[@]}" \
            --build-arg BASE_IMAGE_REF="${{ steps.base.outputs.image }}:${BASE_TAG}@${{ steps.base.outputs.digest }}" \
            --build-arg IMAGE_VERSION="${version}" \
            --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
            --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t local/silver-goggles .

      - name: Verify image contents
        env:
          EXPECT_GPU_UNLOCK: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: bash scripts/verify-image.sh local/silver-goggles

      - name: Decide whether to publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" = "refs/heads/main" ] && [ "$EVENT" != "pull_request" ]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            # Pull requests build and verify only. Publishing from PR code
            # would give any same-repo branch a path into the packages
            # namespace.
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "Ref $REF ($EVENT): build only."
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push versioned tags
        id: push
        if: steps.publish.outputs.publish == 'true'
        timeout-minutes: 15
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publish is only allowed from main (got ${GITHUB_REF})."
            exit 1
          fi
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          os_version="${BASE_TAG%%.*}"
          timestamp="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=7 HEAD)"

          # Versioned tags only. latest/stable are moved by the sign job after
          # the digest is signed and verified.
          tags=(
            "latest-${os_version}" "${timestamp}-latest-${os_version}" "${short_sha}-latest-${os_version}"
            "stable-${os_version}" "${timestamp}-stable-${os_version}" "${short_sha}-stable-${os_version}"
            "${BASE_TAG}" "${BASE_TAG}-${os_version}" "${timestamp}-${BASE_TAG}-${os_version}" "${short_sha}-${BASE_TAG}-${os_version}"
            "latest.${timestamp}" "stable-${os_version}.${timestamp}"
          )

          podman manifest create --amend "${registry}:${tags[0]}" local/silver-goggles
          for tag in "${tags[@]}"; do
            echo "Pushing ${registry}:${tag}"
            podman manifest push --compression-format=zstd --compression-level=9 \
              --digestfile="/tmp/digest.${tag}" \
              "${registry}:${tags[0]}" "docker://${registry}:${tag}"
          done
          echo "digest=$(cat "/tmp/digest.${tags[0]}")" >>"$GITHUB_OUTPUT"
          echo "Pushed ${#tags[@]} versioned tags"

  # Signing and the moving pointers live in their own job behind the protected
  # `publish` environment, whose deployment branch policy only allows main.
  # A pull request that edits this workflow cannot reach the key.
  sign:
    name: Sign and move pointers
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        # Standard installer. The OCI-image wrapper was a reaction to
        # transient GitHub 504s and cost three integration failures; a 504
        # here fails the release closed, and the next run retries.
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin

      - name: Sign and verify
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "::error::SIGNING_SECRET is missing from the publish environment."
            exit 1
          fi
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="${{ needs.publish.outputs.digest }}"

          # containers/image verifies the platform manifest digest, so the
          # children need their own signatures. Sign them explicitly:
          # the recursive path reused one registry token for two uploads and
          # GHCR returned UNAUTHORIZED on the second.
          sign_digest() {
            local target="$1"
            local attempt
            for attempt in 1 2 3; do
              if COSIGN_PASSWORD='' COSIGN_YES='true' cosign sign \
                --key env://COSIGN_PRIVATE_KEY \
                --new-bundle-format=false --use-signing-config=false \
                --registry-referrers-mode=legacy --tlog-upload=false \
                "${registry}@${target}"; then
                return 0
              fi
              echo "sign ${target} attempt ${attempt} failed; retrying in 5s"
              sleep 5
            done
            echo "::error::cosign sign failed for ${target}"
            return 1
          }

          sign_digest "$digest"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "${registry}@${digest}"

          children=$(skopeo inspect --raw "docker://${registry}@${digest}" \
            | jq -r '.manifests[]?.digest')
          if [ -z "$children" ]; then
            echo "::error::no child manifests found in ${digest}"
            exit 1
          fi
          for child in $children; do
            echo "Signing child manifest ${child}"
            sign_digest "$child"
            cosign verify --key cosign.pub --insecure-ignore-tlog=true "${registry}@${child}"
          done

      - name: Move latest and stable
        env:
          OS_VERSION: ${{ needs.publish.outputs.os_version }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Blobs and signatures already exist; this is metadata-only.
          for pointer in latest stable; do
            echo "Moving ${registry}:${pointer}"
            skopeo copy --all "docker://${registry}:latest-${OS_VERSION}" "docker://${registry}:${pointer}"
          done
