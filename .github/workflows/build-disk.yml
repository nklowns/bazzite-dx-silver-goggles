---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - "./disk_config/disk.toml"
      - "./disk_config/iso.toml"
      - "./.github/workflows/build-disk.yml"

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
        with:
          extra-squeeze: true

      - name: Mount BTRFS loopback for podman storage
        if: inputs.platform != 'arm64'
        continue-on-error: true
        run: |
          set -xe
          sudo apt-get update && sudo apt-get install -y btrfs-progs
          sudo modprobe btrfs || true
          TARGET_DIR="/var/lib/containers"
          LOOPBACK_DIR="/mnt/btrfs_loopbacks"
          LOOPBACK_FILE="${LOOPBACK_DIR}/containers.img"
          sudo mkdir -p "${TARGET_DIR}"
          sudo mkdir -p "${LOOPBACK_DIR}"
          AVAILABLE_SPACE=$(df -B1 / | awk 'NR==2 {print $4}' || echo "0")
          echo "Available space on /: $((AVAILABLE_SPACE / 1024 / 1024 / 1024)) GB"
          LOOPBACK_SIZE=$((AVAILABLE_SPACE * 85 / 100))
          # Fallback to 50GB if parsed size is less than 10GB
          if [ -z "${AVAILABLE_SPACE}" ] || [ "${LOOPBACK_SIZE}" -lt $((10 * 1024 * 1024 * 1024)) ]; then
            echo "Warning: df parsed space is invalid or too small. Falling back to 50 GB."
            LOOPBACK_SIZE=$((50 * 1024 * 1024 * 1024))
          fi
          MAX_SIZE=$((70 * 1024 * 1024 * 1024))
          if [ "${LOOPBACK_SIZE}" -gt "${MAX_SIZE}" ]; then
            LOOPBACK_SIZE=${MAX_SIZE}
          fi
          echo "Creating loopback file of size: $((LOOPBACK_SIZE / 1024 / 1024 / 1024)) GB"
          sudo truncate -s "${LOOPBACK_SIZE}" "${LOOPBACK_FILE}"
          sudo mkfs.btrfs -f "${LOOPBACK_FILE}"
          sudo systemd-mount "${LOOPBACK_FILE}" "${TARGET_DIR}" --options="compress-force=zstd:2,discard=async"
          df -h "${TARGET_DIR}"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@31d72f795564fb09943f0705025e75748da3a2d1 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
